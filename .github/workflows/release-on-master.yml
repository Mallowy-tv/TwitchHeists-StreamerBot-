name: Release on master

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test .\TwitchHeists.sln

      - name: Build Release
        run: dotnet build .\TwitchHeists.sln -c Release --no-restore

      - name: Package bridge output
        shell: pwsh
        run: |
          $source = "src\TwitchHeists.StreamerBot.Bridge\bin\Release\net48"
          $artifact = "TwitchHeists-bridge-${{ github.run_number }}.zip"
          if (Test-Path $artifact)
          {
            Remove-Item $artifact -Force
          }
          Compress-Archive -Path "$source\*" -DestinationPath $artifact

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          generate_release_notes: true
          files: TwitchHeists-bridge-${{ github.run_number }}.zip
