<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MímirAI Visual Companion</title>
  <style>
    /* -----------------------------------------------------------------------
       Reset & base
    ----------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --bg2:          #161b22;
      --bg3:          #1c2128;
      --border:       #30363d;
      --gold:         #c9a227;
      --gold-dim:     #8a6e18;
      --text:         #e6edf3;
      --muted:        #8b949e;
      --sidebar-w:    230px;
      --letter-size:  48px;
      --radius:       8px;
      --font-mono:    'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* -----------------------------------------------------------------------
       Layout
    ----------------------------------------------------------------------- */
    .layout {
      display: flex;
      height: 100vh;
    }

    /* -----------------------------------------------------------------------
       Sidebar
    ----------------------------------------------------------------------- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0 0 20px;
      gap: 0;
    }

    /* Logo block */
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .rune-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow:
        -3px -3px 6px 1px rgba(255,255,255,0.28),
        -2px -2px 12px 2px rgba(255,255,255,0.10),
        -1px -1px 22px 3px rgba(255,255,255,0.04);
    }

    .rune {
      font-size: 20px;
      line-height: 1;
    }

    .wordmark {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .version {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
      margin-top: 1px;
    }

    /* Sidebar section labels */
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 18px;
      margin-bottom: 6px;
    }

    .sidebar-section {
      padding: 0 18px;
      margin-bottom: 20px;
    }

    /* Status indicator */
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 7px;
      vertical-align: middle;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #3fb950; }

    .status-text {
      font-size: 12px;
      color: var(--muted);
      vertical-align: middle;
    }

    /* Screen filename */
    .screen-name {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    /* Push screen-name to bottom */
    .sidebar-bottom {
      margin-top: auto;
      padding: 16px 18px 0;
      border-top: 1px solid var(--border);
    }

    /* -----------------------------------------------------------------------
       Main content
    ----------------------------------------------------------------------- */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--bg);
    }

    /* -----------------------------------------------------------------------
       Content area — fragment renders here
    ----------------------------------------------------------------------- */
    #content {
      flex: 1;
    }

    /* -----------------------------------------------------------------------
       Placeholder
    ----------------------------------------------------------------------- */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    .placeholder-icon {
      font-size: 36px;
      opacity: 0.3;
    }
    .placeholder p {
      font-size: 15px;
      color: var(--muted);
    }
    .placeholder p + p {
      font-size: 12px;
      font-family: var(--font-mono);
      opacity: 0.6;
    }

    /* -----------------------------------------------------------------------
       Fragment typography helpers (used by AI-written fragments)
    ----------------------------------------------------------------------- */
    #content h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    #content .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* -----------------------------------------------------------------------
       Options grid
    ----------------------------------------------------------------------- */
     #content .options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
        align-items: start;
        gap: 14px;
        margin-bottom: 28px;
      }

     #content .option {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 16px;
        background: var(--bg2);
        border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 18px 20px;
         transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
         position: relative;
         width: 100%;
         max-width: 100%;
         min-width: 0;
         container-type: inline-size;
       }

     #content .option.full-width {
       grid-column: 1 / -1;
       width: 100%;
     }

     #content .option.stacked {
       grid-template-columns: 1fr;
       width: 100%;
     }

    /* Letter badge */
      #content .option .letter {
        flex-shrink: 0;
        width: var(--letter-size);
        height: var(--letter-size);
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
        color: var(--muted);
      }

      #content .option .content {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

    /* Option content text */
    #content .option .content h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

     #content .option .content p {
       font-size: 13px;
       color: var(--muted);
       line-height: 1.5;
     }

    /* -----------------------------------------------------------------------
       Low-fidelity mockup helpers
    ----------------------------------------------------------------------- */
      #content .mockup-shell {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 180px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        align-self: stretch;
        overflow: hidden;
      }

     #content .mockup-topbar,
     #content .mockup-row,
      #content .mockup-sidebar-layout,
      #content .mockup-card-group,
      #content .mockup-rail,
      #content .mockup-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

     #content .mockup-grid-2,
     #content .mockup-grid-3 {
       display: grid;
       gap: 10px;
       align-items: start;
       width: 100%;
     }

     #content .mockup-grid-2 {
       grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
     }

     #content .mockup-grid-3 {
       grid-template-columns: minmax(72px, 0.7fr) minmax(0, 1.4fr) minmax(0, 1fr);
     }

     #content .mockup-icon,
     #content .mockup-pill,
     #content .mockup-hero,
     #content .mockup-card,
     #content .mockup-sidebar,
     #content .mockup-section,
     #content .mockup-rail-card {
       background: linear-gradient(180deg, #2d333b, #232a32);
       border: 1px solid #3a414a;
     }

    #content .mockup-icon {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    #content .mockup-pill {
      width: 72px;
      height: 12px;
      border-radius: 999px;
    }

    #content .mockup-pill.short {
      width: 40px;
    }

    #content .mockup-hero {
      width: 100%;
      height: 58px;
      border-radius: 8px;
    }

     #content .mockup-hero.compact {
       height: 42px;
     }

     #content .mockup-hero.tall {
       height: 74px;
     }

       #content .mockup-row {
         align-items: stretch;
         flex-wrap: wrap;
       }

     #content .mockup-card {
        flex: 1 1 140px;
        min-width: 140px;
        min-height: 72px;
        border-radius: 8px;
      }

    #content .mockup-sidebar-layout {
      align-items: stretch;
      min-height: 120px;
    }

     #content .mockup-sidebar {
       width: 56px;
       border-radius: 8px;
       flex-shrink: 0;
     }

     #content .mockup-section,
     #content .mockup-rail-card {
       border-radius: 8px;
       padding: 10px;
       display: flex;
       flex-direction: column;
       gap: 10px;
       min-width: 0;
     }

     #content .mockup-section.tight,
     #content .mockup-rail-card.tight {
       gap: 8px;
       padding: 8px;
     }

      #content .mockup-main {
         flex: 1;
         display: flex;
         flex-direction: column;
        gap: 10px;
        min-width: 0;
      }

      #content .mockup-card-stack {
         display: flex;
         flex-direction: column;
         gap: 10px;
         flex: 1;
         min-width: 0;
       }

     #content .mockup-card-group {
       align-items: stretch;
     }

     #content .mockup-card-group > .mockup-card,
     #content .mockup-card-group > .mockup-section {
       flex: 1 1 0;
     }

     #content .mockup-rail {
       align-items: stretch;
     }

     #content .mockup-rail.vertical {
       flex-direction: column;
     }

      #content .mockup-rail-card {
        min-width: 72px;
        flex: 1 1 0;
      }

     #content .mockup-grid-2 > *,
     #content .mockup-grid-3 > *,
     #content .mockup-sidebar-layout > *,
     #content .mockup-card-group > *,
     #content .mockup-rail > * {
       min-width: 0;
     }

     #content .mockup-actions {
       align-items: center;
     }

     #content .mockup-actions .mockup-pill {
       height: 16px;
       width: 88px;
     }

     #content .mockup-actions .mockup-pill.short {
       width: 56px;
     }

     #content .mockup-gap-sm {
       gap: 8px;
     }

     #content .mockup-gap-lg {
       gap: 14px;
     }

      @container (max-width: 620px) {
        #content .option {
          grid-template-columns: 1fr;
          width: 100%;
       }

       #content .option .content,
       #content .mockup-shell {
         width: 100%;
       }

        #content .mockup-row,
        #content .mockup-sidebar-layout,
        #content .mockup-card-group,
        #content .mockup-rail,
        #content .mockup-actions {
          flex-direction: column;
        }

        #content .mockup-grid-2,
        #content .mockup-grid-3 {
          grid-template-columns: 1fr;
        }

        #content .mockup-sidebar {
          width: 100%;
          min-height: 36px;
        }
     }

     @media (max-width: 900px) {
       .main {
         padding: 28px 20px;
       }

       #content .options {
         grid-template-columns: 1fr;
       }

       #content .option {
         width: 100%;
         max-width: 100%;
         padding: 16px;
       }

       #content .option .letter {
         width: 40px;
         height: 40px;
         font-size: 18px;
       }
     }
  </style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="rune-wrap"><span class="rune">ᛗ</span></div>
      <div>
        <div class="wordmark">MímirAI</div>
        <div class="version">v0.1.8</div>
      </div>
    </div>

    <div class="sidebar-label">Connection</div>
    <div class="sidebar-section">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Connecting…</span>
    </div>

    <div class="sidebar-label">Screen</div>
    <div class="sidebar-section">
      <div class="screen-name" id="screen-name">—</div>
    </div>

    <div class="sidebar-bottom">
      <div class="screen-name" style="color:#484f58;font-size:10px;">Visual Companion</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div id="content">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">ᛗ</div>
        <p>Waiting for content…</p>
        <p>The AI will push a screen here during brainstorming.</p>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------------
  // DOM refs
  // -------------------------------------------------------------------------
  const contentEl    = document.getElementById('content');
  const placeholderEl = document.getElementById('placeholder');
  const statusDot    = document.getElementById('status-dot');
  const statusText   = document.getElementById('status-text');
  const screenName   = document.getElementById('screen-name');

  // -------------------------------------------------------------------------
  // Status helpers
  // -------------------------------------------------------------------------
  function setStatus(connected) {
    statusDot.className = 'status-dot' + (connected ? ' connected' : '');
    statusText.textContent = connected ? 'Connected' : 'Reconnecting…';
  }

  // -------------------------------------------------------------------------
  // Render a screen fragment
  // -------------------------------------------------------------------------
  function renderFragment(html, filename) {
    // Replace content — keep placeholder hidden by removing it
    contentEl.innerHTML = html;
    screenName.textContent = filename || '—';
    // Ensure placeholder is gone
    const p = document.getElementById('placeholder');
    if (p) p.remove();
  }

  // -------------------------------------------------------------------------
  // Fetch latest screen from /screen
  // -------------------------------------------------------------------------
  function loadScreen() {
    fetch('/screen')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.html) {
          renderFragment(data.html, data.filename);
        }
      })
      .catch(function () {/* ignore */});
  }

  // -------------------------------------------------------------------------
  // SSE — connect to /events, reconnect on error
  // -------------------------------------------------------------------------
  var es;
  var reconnectTimer;

  function connect() {
    if (es) { try { es.close(); } catch (e) {} }
    es = new EventSource('/events');

    es.onopen = function () {
      setStatus(true);
    };

    es.onmessage = function (e) {
      var data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === 'screen') {
        loadScreen();
      }
    };

    es.onerror = function () {
      setStatus(false);
      es.close();
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    };
  }

  // -------------------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------------------
  // Load any already-present screen immediately
  loadScreen();
  // Connect SSE
  connect();
})();
</script>
</body>
</html>
